# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
  - board: nice_nano//zmk
    shield: eternal_keypad
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    snippet: studio-rpc-usb-uart
    artifact-name: eternal_keypad-nice_nano
  - board: nice_nano//zmk
    shield: eternal_keypad_lefty
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    snippet: studio-rpc-usb-uart
    #cmake-args: "-DKEYMAP_FILE=eternal_keypad_lefty.keymap"
    #keymap-name: "lefty"
    artifact-name: eternal_keypad-nice_nano-lefty
